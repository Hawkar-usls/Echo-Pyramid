name: Compose JANUS Echo-Pyramid Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-current-pinned-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Echo-Pyramid
        uses: actions/checkout@v4

      - name: Checkout JANUS swarm body
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-distributed-ai-swarm
          ref: main
          path: _swarm

      - name: Verify pinned swarm Pyramid blob and ownership anchors
        run: |
          python tools/verify_swarm_checkout.py \
            _swarm/firmware/pyramid/ATOM_MATRIX_Pyramid.ino

      - name: Compose Pyramid Language v0.3 ESP32-r2 firmware
        run: |
          mkdir -p build/ATOM_MATRIX_Pyramid_JanusVoice
          python tools/compose_swarm_firmware.py \
            _swarm/firmware/pyramid/ATOM_MATRIX_Pyramid.ino \
            build/ATOM_MATRIX_Pyramid_JanusVoice/ATOM_MATRIX_Pyramid_JanusVoice.ino

      - name: Verify composed bundle
        run: |
          set -euo pipefail
          B=build/ATOM_MATRIX_Pyramid_JanusVoice
          test -s "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          test -s "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino.receipt.json"
          test -s "$B/JanusPyramid117121DSP.h"
          test -s "$B/JanusPyramid117121Profile.h"
          grep -q 'JanusPyramid117121DSP janusVoiceDsp' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'portMUX_TYPE janusVoiceControlMux' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'janusVoiceApplyPendingAtBlockBoundary();' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'janusVoiceProcessChunk(chunk.mono, chunk.frames);' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'janusVoiceSafetyTick();' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'PYRAMID_LANGUAGE_FAILSAFE' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'JANUS_PYRAMID_DSP_OVER_BUDGET_TRIP 3' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          grep -q 'PYR=0..100' "$B/ATOM_MATRIX_Pyramid_JanusVoice.ino"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/ATOM_MATRIX_Pyramid_JanusVoice/ATOM_MATRIX_Pyramid_JanusVoice.ino.receipt.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'janus.echo_pyramid.compose_receipt.v2.6'
          assert r['profile_id'].endswith('/ESP32-r2')
          assert r['control_ownership']['dsp_mutable_state_owner'] == 'JANUS_AUDIO_PLAYBACK_TASK'
          assert r['control_ownership']['external_control_model'] == 'PORTMUX_GUARDED_REQUEST_MAILBOX'
          assert r['control_ownership']['application_boundary'] == 'NEXT_PCM_BLOCK'
          assert r['control_ownership']['direct_cross_core_dsp_reset_from_usb'] is False
          assert r['real_time_budget']['failsafe']['enabled_by_default'] is True
          assert r['real_time_budget']['failsafe']['consecutive_blocks'] == 3
          assert r['real_time_budget']['failsafe']['action'] == 'DRY_BYPASS_UNTIL_EXPLICIT_PYR_ON_OR_REBOOT'
          assert r['usb_control']['enabled'] is True
          print('COMPOSED RECEIPT PASS')
          PY

      - name: Upload Arduino source bundle
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-Echo-Pyramid-v0.3-ESP32-r2-source
          path: build/ATOM_MATRIX_Pyramid_JanusVoice/
          if-no-files-found: error
          retention-days: 30
