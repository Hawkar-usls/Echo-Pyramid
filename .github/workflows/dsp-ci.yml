name: Echo Pyramid DSP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy embedded modal profile
        run: python tools/verify_profile.py
      - name: Build Pyramid Language v0.3 test
        run: g++ -std=c++11 -O2 -Wall -Wextra -pedantic -Ifirmware tests/test_anchor_dsp.cpp -o test_anchor_dsp
      - name: Run Pyramid Language v0.3 test
        run: ./test_anchor_dsp
      - name: Build legacy modal DSP test
        run: g++ -std=c++11 -O2 -Wall -Wextra -pedantic -Ifirmware tests/test_dsp.cpp -o test_dsp
      - name: Run legacy modal DSP test
        run: ./test_dsp
